<section class="dashboard-panel">
    <div class="panel-header">
        <h2>PC Stats</h2>
        <button (click)="refreshMetrics()">Refresh metrics</button>
    </div>


    <div class="metrics-grid">
    @for (metric of metrics; track metric.name) {
        <article class="metric-card">
        <h3>{{ metric.name }}</h3>
        <p class="metric-usage">Usage: {{ metric.usage }}%</p>
        <p class="metric-detail">Detail: {{ metric.detail }}</p>
        </article>
    }
</div>
</section>
